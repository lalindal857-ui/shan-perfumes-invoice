
name: Build SHAN PERFUMES APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip -q SHAN_PERFUMES_Phone_APK_Build_Project.zip

      - name: Build APK
        run: |
          cd SHAN_PERFUMES_Android_Project
          gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SHAN-PERFUMES-APK
          path: SHAN_PERFUMES_Android_Project/app/build/outputs/apk/debug/app-debug.apk
